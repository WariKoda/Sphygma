<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">
  <!-- Sphygma-Zeichen: Handgelenkmessgerät.
       Das Feld ist 108×108, wie Android es für adaptive Symbole verlangt.
       Sichtbar bleibt nur der innere Kreis von 72 — alles Wesentliche liegt
       deshalb zwischen 18 und 90. Die Bänder laufen bewusst bis an diese
       Grenze und nicht darüber hinaus: Ein Band, das die Maske abschneidet,
       sieht nach Fehler aus, nicht nach Absicht. -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <!-- Die beiden Bandenden, oben und unten -->
    <rect x="43" y="20" width="22" height="16" rx="6" fill="#FFFFFF" opacity="0.62" stroke="none"/>
    <rect x="43" y="72" width="22" height="16" rx="6" fill="#FFFFFF" opacity="0.62" stroke="none"/>
    <!-- Das Gehäuse -->
    <rect x="30" y="33" width="48" height="42" rx="11" fill="#FFFFFF" stroke="none"/>
    <!-- Der Ausschlag im Display -->
    <path d="M39 54 h7.5 l4.5-9 5 18 4-9 H68" stroke="#3A5A6B" stroke-width="5.5"/>
  </g>
</svg>
